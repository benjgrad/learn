# Palestra web app. Container: palestra-web (compose.yml), published on 127.0.0.1:3005.
# Install: sudo cp to /etc/nginx/sites-available/ and symlink into sites-enabled/,
# then `sudo certbot --nginx -d learning.gradyserver.com` to add the TLS block.

server {
    listen 80;
    server_name learning.gradyserver.com;

    location / {
        proxy_pass            http://127.0.0.1:3005;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 5s;
        client_max_body_size  10M;
    }

    # AI feedback / interview routes stream from Anthropic and can run long.
    location /api/ {
        proxy_pass            http://127.0.0.1:3005;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        client_max_body_size  10M;
    }
}
