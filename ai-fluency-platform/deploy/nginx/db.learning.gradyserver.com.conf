# Supabase API gateway (Kong) from the Supabase CLI stack, on 127.0.0.1:54321.
# The browser talks to this directly — NEXT_PUBLIC_SUPABASE_URL points here.
# Install: sudo cp to /etc/nginx/sites-available/ and symlink into sites-enabled/,
# then `sudo certbot --nginx -d db.learning.gradyserver.com` to add the TLS block.

server {
    listen 80;
    server_name db.learning.gradyserver.com;

    # Storage uploads.
    client_max_body_size 50M;

    location / {
        proxy_pass            http://127.0.0.1:54321;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 5s;
    }

    # Realtime is a websocket; it must not be buffered and needs the upgrade headers.
    location /realtime/ {
        proxy_pass            http://127.0.0.1:54321;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_buffering       off;
        proxy_read_timeout    3600s;
    }

    # Supabase Studio is NOT exposed here — it stays on 127.0.0.1:54323 only.
}
