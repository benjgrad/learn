<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f9;padding:32px 12px;">
      <tr><td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:440px;background:#ffffff;border-radius:12px;padding:32px;">
          <tr><td style="font-size:18px;font-weight:600;color:#0f172a;padding-bottom:8px;">Your Palestra sign-in code</td></tr>
          <tr><td style="font-size:14px;color:#475569;padding-bottom:8px;">Enter this code on the sign-in screen. It expires in 60 minutes.</td></tr>
          <tr><td align="center" style="padding:20px 0 24px 0;">
            <div style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:36px;font-weight:700;letter-spacing:8px;color:#0f172a;">{{ .Token }}</div>
          </td></tr>
          <tr><td style="font-size:12px;color:#64748b;border-top:1px solid #e2e8f0;padding-top:16px;">
            Reading this on the device you started from?
            <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=magiclink" style="color:#2563eb;">Open Palestra and sign in</a>.
          </td></tr>
          <tr><td style="font-size:12px;color:#94a3b8;padding-top:16px;">If you didn&rsquo;t request this, you can safely ignore this email.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
